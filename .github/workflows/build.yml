name: Build APKs

# Every push / PR: run the checks and build both APKs (downloadable as a workflow artifact).
# A tag like v32 also publishes a GitHub release with the APKs attached (Obtainium can follow it).
#
# Signing: add repository secrets
#   KEYSTORE_BASE64  base64 of keystore/tn-hud.jks   (macOS: base64 -i keystore/tn-hud.jks | pbcopy)
#   KS_PASS          keystore password
#   KEY_ALIAS        key alias (tnhud)
# Without them (forks, PRs) the build is signed with a throwaway key: fine for testing, but it will not
# install over a copy signed with your real key.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-23" "build-tools;34.0.0" > /dev/null

      - name: Checks (SGP4, astronomy, NOAA parsing)
        run: ./test.sh

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/tn-hud.jks
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore keystore/tn-hud.jks -alias tnhud -storepass throwaway -keypass throwaway \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TN-HUD CI" -noprompt
            echo "SIGNED_WITH=throwaway" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          BUILD_TOOLS: "34.0.0"
          KS_PASS: ${{ secrets.KS_PASS || 'throwaway' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tnhud' }}
        run: |
          [ "$SIGNED_WITH" = throwaway ] && export KS_PASS=throwaway KEY_ALIAS=tnhud
          ./build.sh all
          VER=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          rm -f dist/*.idsig
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: tn-hud-${{ env.VER }}-${{ env.SIGNED_WITH }}
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED_WITH == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TN-HUD-Live.apk dist/TN-HUD-Icons.apk \
            --title "TN-HUD $GITHUB_REF_NAME" --generate-notes
