name: Build APKs

# Every push / PR: run the checks and build all three APKs (wallpaper app, icon pack, notification link),
# each uploaded as its own workflow artifact.
# A tag like v32 also publishes a GitHub release with the APKs attached (Obtainium can follow it).
# Every push to main refreshes the "nightly" pre-release with the plain APKs (no zip).
# `git push origin main --tags` fires two push events for the same commit (branch + tag); the gate job
# skips the branch build when that commit already carries a v* tag, so only the tag run builds.
#
# Signing: add repository secrets
#   KEYSTORE_BASE64  base64 of keystore/tn-hud.jks   (macOS: base64 -i keystore/tn-hud.jks | pbcopy)
#   KS_PASS          keystore password
#   KEY_ALIAS        key alias (tnhud)
# Without them (forks, PRs) the build is signed with a throwaway key: fine for testing, but it will not
# install over a copy signed with your real key.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# two quick pushes to main must not race on the nightly release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          sparse-checkout: .github
      - id: g
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            # lightweight tags list the commit; annotated ones list it on their peeled ^{} line
            tags=$(git ls-remote --tags origin 'refs/tags/v*' | awk -v s="$GITHUB_SHA" '$1 == s {print $2}' | sed 's|refs/tags/||; s|\^{}||' | sort -u)
            if [ -n "$tags" ]; then
              build=false
              echo "::notice::$GITHUB_SHA is tagged ($(echo $tags)); the tag run builds it"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-23" "build-tools;34.0.0" > /dev/null

      - name: Checks (SGP4, astronomy, NOAA parsing)
        run: ./test.sh

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/tn-hud.jks
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore keystore/tn-hud.jks -alias tnhud -storepass throwaway -keypass throwaway \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=TN-HUD CI" -noprompt
            echo "SIGNED_WITH=throwaway" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          BUILD_TOOLS: "34.0.0"
          KS_PASS: ${{ secrets.KS_PASS || 'throwaway' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tnhud' }}
        run: |
          [ "$SIGNED_WITH" = throwaway ] && export KS_PASS=throwaway KEY_ALIAS=tnhud
          ./build.sh all
          VER=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml | head -1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          rm -f dist/*.idsig
          ls -la dist

      - name: Check all three APKs exist
        run: |
          for f in TN-HUD-Live TN-HUD-Icons TN-HUD-Link; do
            [ -f "dist/$f.apk" ] || { echo "::error::dist/$f.apk was not built"; exit 1; }
          done

      # one artifact per APK, so each shows up separately on the run page
      - uses: actions/upload-artifact@v4
        with:
          name: TN-HUD-Live-${{ env.VER }}-${{ env.SIGNED_WITH }}
          path: dist/TN-HUD-Live.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TN-HUD-Icons-${{ env.VER }}-${{ env.SIGNED_WITH }}
          path: dist/TN-HUD-Icons.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TN-HUD-Link-${{ env.VER }}-${{ env.SIGNED_WITH }}
          path: dist/TN-HUD-Link.apk

      # Workflow artifacts always download as zip files. Every push to main also replaces a rolling "nightly"
      # pre-release holding the plain APKs, so the latest build is a direct .apk download at a fixed URL:
      #   https://github.com/<owner>/<repo>/releases/download/nightly/TN-HUD-Live.apk  (and -Icons, -Link)
      # Tags made with the workflow token start no new run, and the gate only looks at v* tags.
      - name: Nightly pre-release (plain APKs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED_WITH == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/TN-HUD-Live.apk dist/TN-HUD-Icons.apk dist/TN-HUD-Link.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "TN-HUD nightly ($VER, ${GITHUB_SHA::7})" \
            --notes "Latest build of main at ${GITHUB_SHA::7}, replaced on every push. Signed with the release key."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED_WITH == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TN-HUD-Live.apk dist/TN-HUD-Icons.apk dist/TN-HUD-Link.apk \
            --title "TN-HUD $GITHUB_REF_NAME" --generate-notes
